
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab6-backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lab6-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped



  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: lab8-keycloak
    command: start-dev
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - keycloak-data:/opt/keycloak/data
    restart: unless-stopped

volumes:
  keycloak-data: