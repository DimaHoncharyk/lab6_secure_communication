
name: Lab 6 CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest tests/test_crypto.py -v

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React frontend
        run: npm run build


  docker-build:
    runs-on: ubuntu-latest
    needs: [ test, frontend-build ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t lab6-backend .

      - name: Build frontend Docker image
        run: docker build -t lab6-frontend ./frontend

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Start full application
        run: docker compose up --build -d

      - name: Check backend through Nginx
        run: |
          for i in $(seq 1 20); do
            if curl --fail -X POST http://localhost:8080/api/crypto-keys/generate/rsa-keys; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down
