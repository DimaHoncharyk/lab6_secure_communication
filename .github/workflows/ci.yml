
name: Lab 8 CI - OIDC SecureChat

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all unit tests
        run: python -m pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, frontend-build]

    env:
      KEYCLOAK_ADMIN_PASSWORD: ci-test-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t lab8-backend .

      - name: Build frontend Docker image
        run: docker build -t lab8-frontend ./frontend

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Start full application
        run: docker compose up --build -d

      - name: Wait for backend through Nginx
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              http://localhost:8080/api/crypto-keys/generate/rsa-keys || true)

            echo "Attempt $i: HTTP $STATUS"

            if [ "$STATUS" = "401" ]; then
              echo "Backend is reachable and JWT protection is active"
              exit 0
            fi

            sleep 3
          done

          echo "Backend did not become ready"
          exit 1

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down
